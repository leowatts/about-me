<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ "/assets/profile-32x32.png" | relative_url }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ "/assets/profile-16x16.png" | relative_url }}">
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/main.css" | relative_url }}">
  </head>
  <body>
      <header class="card" style="display: flex; flex-direction: row; background-color: #d0e0d0; align-items: center; margin-bottom: 1rem;">
          <a href="{{ "/" | relative_url }}">
              <img style="display: block;" alt="Leo profile picture" src="{{ "/assets/profile-90x90.png" | relative_url }}">
          </a>
          <div style="margin-left: 20px;">
            <h1 style="margin: 1px;">Leo Watts</h1>
            <h2 style="margin: 1px; font-size: 18px;">Maths Student · Software Developer · Brighton/Oxford</h2>
          </div>
      </header>
    {{ content }}
  </body>
</html>
